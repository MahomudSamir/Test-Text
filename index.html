<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Texto para ZType</title>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    max-width:900px;
    margin:40px auto;
    line-height:1.8;
    white-space:pre-wrap;
    padding:20px;
}

</style>

</head>

<body>

Cargando texto...

<script>

fetch("texto.txt")
.then(response => response.text())
.then(texto => {
    document.body.innerText = texto;
})
.catch(() => {
    document.body.innerText = "Error cargando texto.";
});

</script>

</body>

</html>
